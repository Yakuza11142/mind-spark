name: mind_spark
description: "AI TUTOR & AR LAB"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

# Launcher Icon Configuration pointing to root-level asset
flutter_launcher_icons:
  image_path: "icon_launcher.png"
  android: true
  ios: false
  min_sdk_android: 24

flutter:
  uses-material-design: true

  # Asset bundles mapping your root-level video file
  assets:
    - intro.mp4
