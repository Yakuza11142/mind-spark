name: mind_spark
description: "AI TUTOR & AR LAB"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0' # Updated to match modern Flutter 3.47 toolchains

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0 # Updated for Flutter 3.47 standard compliance
  flutter_launcher_icons: ^0.14.4

# Launcher Icon Configuration pointing to root-level asset
flutter_launcher_icons:
  image_path: "icon_launcher.png"
  android: true
  ios: false
  min_sdk_android: 24

flutter:
  uses-material-design: true

  # Asset bundles mapping your root-level video file
  assets:
    - intro.mp4
