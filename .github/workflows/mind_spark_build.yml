name: Mind Spark Elite CI/CD - Build APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Android APK and App Bundle
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java environment (Required for Android compilation)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Set up Flutter SDK environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Install project dependencies (maps assets like intro.mp4 and icons)
      - name: Install Dependencies
        run: flutter pub get

      # 5. Run Flutter code analysis
      - name: Analyze Project Source
        run: flutter analyze

      # 6. Build Release APK (for direct device installation/testing)
      - name: Build Android Release APK
        run: flutter build apk --release

      # 7. Build Android App Bundle AAB (for Google Play Store deployment)
      - name: Build Android App Bundle AAB
        run: flutter build appbundle --release

      # 8. Upload both APK and AAB to GitHub Artifacts
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MindSparkElite-Release-Artifacts
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
