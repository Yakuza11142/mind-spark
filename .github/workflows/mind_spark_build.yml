name: Build and Deploy Mind Spark Cross-Platform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Multi-Platform Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: false

      # --- 1. INITIAL RUNTIME CLEANING SPRINT ---
      - name: Auto Format Entire Codebase Structure
        run: dart format . || echo "Bypassing format exceptions"

      # --- 2. ANDROID ARCHITECTURE REGENERATION ---
      - name: Force Recreate Fresh Android Structure
        run: |
          rm -rf android/
          flutter create --platforms=android --org com.mindspark --project-name=mind_spark . || true

      # --- 3. BRANDING PLATFORM ASSET RECOVERY ---
      - name: Auto Clone Launcher Icons into Web Directory
        run: |
          if [ -f icon_launcher.png ]; then
            mkdir -p web/icons
            cp icon_launcher.png web/favicon.png
            cp icon_launcher.png web/icons/Icon-192.png
            cp icon_launcher.png web/icons/Icon-512.png
            cp icon_launcher.png web/icons/Icon-maskable-192.png
            cp icon_launcher.png web/icons/Icon-maskable-512.png
            echo "Branding assets cloned into web structure successfully."
          else
            echo "Error: icon_launcher.png is missing from the root of your project!"
            exit 1
          fi

      # --- 4. REPAIR INDEX HTML BASE PLACEHOLDER ---
      - name: Repair Index HTML Base Placeholder
        run: |
          sed -i 's|<base href="[^"]*">|<base href="\$FLUTTER_BASE_HREF">|g' web/index.html || true

      - name: Install Dependencies
        run: flutter pub get || true

      - name: Generate App Launcher Icons
        run: dart run flutter_launcher_icons || echo "Skipping icon generation"

      # ✅ 5. CLOUD STRUCTURAL ASSEMBLE MOTOR
      # Automatically discovers any view file anywhere in 'lib/' and binds it on the fly
      - name: Cloud-Side Automated Connection Assembly
        run: |
          echo "📡 Crawling entire lib directory for views and screens..."
          
          ROUTER_FILE="lib/generated_router.dart"
          
          # Initialize the automated router file
          cat << 'EOF' > $ROUTER_FILE
          import 'package:flutter/material.dart';
          EOF

          # 1. Dynamically scan the ENTIRE lib/ directory for screens/views and add imports
          find lib -type f \( -name "*_screen.dart" -o -name "*_view.dart" \) | while read -r file; do
            clean_import_path="${file#lib/}"
            echo "import '$clean_import_path';" >> $ROUTER_FILE
          done

          # 2. Append the routing framework core shell
          cat << 'EOF' >> $ROUTER_FILE

          class AutomatedRouter {
            static Route<dynamic> resolveRoutes(RouteSettings settings) {
              final String path = settings.name ?? '/';

              return MaterialPageRoute(
                settings: settings,
                builder: (BuildContext context) {
          EOF

          # 3. Dynamic Router Generation Engine
          find lib -type f \( -name "*_screen.dart" -o -name "*_view.dart" \) | while read -r file; do
            filename=$(basename "$file" .dart)
            
            # Convert snake_case file titles directly into class PascalCase (e.g. spark_ai_view -> SparkAiView)
            classname=$(echo "$filename" | awk -F_ '{for(i=1;i<=NF;i++) printf "%s", toupper(substr($i,1,1)) substr($i,2)}温')
            
            # Form clean url paths by stripping design tags
            short_path=$(echo "$filename" | sed 's/_screen//g' | sed 's/_view//g')

            if [ "$filename" = "splash_screen" ] || [ "$filename" = "splash" ]; then
              echo "        if (path == '/' || path.contains('splash')) return const ${classname}();" >> $ROUTER_FILE
            else
              echo "        if (path.contains('$short_path')) return const ${classname}();" >> $ROUTER_FILE
            fi
          done

          # 4. Final close of routing syntax boundaries securely
          cat << 'EOF' >> $ROUTER_FILE
                  
                  // Default fallback protection if page isn't found
                  return const Scaffold(body: Center(child: Text("Route Not Found")));
                },
              );
            }
          }
          EOF

          # 5. Clean up any leftover explicit layout keywords safely
          find . -name "*.dart" -type f -exec sed -i 's|const \[|\[|g' {} + 2>/dev/null || true
          find . -name "*.dart" -type f -exec sed -i 's|return const |return |g' {} + 2>/dev/null || true
          
          echo "🏆 Successfully scanned, parsed, and mapped all project modules into $ROUTER_FILE."

      # --- 6. MULTI-PLATFORM ENFORCED PRODUCTION DRIVERS ---
      - name: Build Release APK
        run: |
          flutter build apk --release \
            --android-skip-build-dependency-validation \
            --build-name=1.0.0 \
            --build-number=1 \
            --no-tree-shake-icons

      - name: Build Release App Bundle (AAB)
        run: |
          flutter build appbundle --release \
            --android-skip-build-dependency-validation \
            --build-name=1.0.0 \
            --build-number=1 \
            --no-tree-shake-icons

      # --- DISABLES BRACKET CACHE TO ENSURE REAL-TIME COMPONENT LOADS LIVE ---
      - name: Build Production Web App for GitHub Pages
        run: flutter build web --release --base-href "/mind-spark/" --pwa-strategy=none

      - name: Upload Android APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

      - name: Upload Web Build Blueprint for Deployment Step
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy Live to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages API Pipeline
        id: deployment
        uses: actions/deploy-pages@v4
