name: Build and Deploy Mind Spark Cross-Platform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Multi-Platform Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      # --- STEP FIXED: DOES WHAT FLUTTER SAID BY RE-CREATING A PRISTINE STRUCTURE ---
      - name: Regenerate Pristine Android Platform Structure
        run: |
          # 1. Clear out the incompatible, outdated legacy android directory
          rm -rf android/
          
          # 2. Run flutter create to build a modern, supported Android shell directory
          flutter create --platforms=android --org com.mindspark .
          
          # 3. Rename the directory structure to strictly match your target package identifier
          mv android/app/src/main/kotlin/com/mindspark/mind_spark android/app/src/main/kotlin/com/mindspark/com
          
          # 4. Patch files to make sure the package maps cleanly to ://mindspark.com
          sed -i 's/com.mindspark.mind_spark/://mindspark.com/g' android/app/build.gradle
          sed -i 's/package com.mindspark.mind_spark/package ://mindspark.com/g' android/app/src/main/kotlin/com/mindspark/com/MainActivity.kt
          sed -i 's/package="com.mindspark.mind_spark"/package="://mindspark.com"/g' android/app/src/main/AndroidManifest.xml || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Apply Dart Fixes
        run: dart fix --apply

      - name: Format Dart Code
        run: dart format .

      - name: Generate App Launcher Icons
        run: dart run flutter_launcher_icons || echo "Skipping icon generation, using existing assets."

      - name: Build Release APK with Hardcoded Project Property Safeties
        run: flutter build apk --release --android-skip-build-dependency-validation --dart-define=DART_SHARED_PACKAGES=true

      - name: Build Release App Bundle (AAB)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Build Production Web App for GitHub Pages
        run: flutter build web --release --base-href "/mind-spark/"

      - name: Upload Android APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

      - name: Upload Web Build Blueprint for Deployment Step
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy Live to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages API Pipeline
        id: deployment
        uses: actions/deploy-pages@v4
