name: Build Mind Spark APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Auto-Generate Clean Android Infrastructure
        run: |
          # 1. Clean out any partial structures
          rm -rf android/
          
          # 2. Recreate native android folders using your exact pubspec name and target bundle ID
          flutter create . --platforms=android --org com.mindspark --project-name mind_spark

      - name: Install Dependencies
        run: flutter pub get

      - name: Apply Dart Fixes
        run: dart fix --apply

      - name: Format Dart Code
        run: dart format .

      - name: Generate App Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build Release APK with Validation Bypass
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
