name: Build and Deploy Mind Spark Cross-Platform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Multi-Platform Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: false

      # --- FIX: GENERATES THE MISSING WEB ENGINE PLATFORM DIRECTORY ---
      - name: Force Recreate Fresh Platforms
        run: |
          rm -rf android/
          flutter create --platforms=android,web --org com.mindspark --project-name=mind_spark .

      # --- RE-INJECT YOUR VIDEO ASSET PATH INTO THE DYNAMICALLY GENERATED PUBSPEC ---
      - name: Patch Assets Configuration
        run: |
          cat << 'EOF' >> pubspec.yaml

          flutter_launcher_icons:
            image_path: "icon_launcher.png"
            android: true
            ios: false
            min_sdk_android: 24

          flutter:
            uses-material-design: true
            assets:
              - intro.mp4
          EOF

      # --- ENFORCE COMPILATION CHECKS ---
      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Launcher Icons
        run: dart run flutter_launcher_icons || echo "Skipping icon generation"

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Release App Bundle (AAB)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Build Production Web App for GitHub Pages
        run: flutter build web --release --base-href "/mind-spark/"

      - name: Upload Android APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

      - name: Upload Web Build Blueprint for Deployment Step
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy Live to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages API Pipeline
        id: deployment
        uses: actions/deploy-pages@v4
