name: Build and Deploy Mind Spark Cross-Platform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Multi-Platform Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Format Code & Safely Recreate Android Directory
        run: |
          dart format . || echo "Bypassing formatting irregularities"
          rm -rf android/
          flutter create --platforms=android --org com.mindspark --project-name=mind_spark . || true

      - name: Auto Clone Launcher Icons into Web Directory
        run: |
          if [ -f icon_launcher.png ]; then
            echo "🔧 Instantiating clean icon assets tree..."
            mkdir -p web/icons
            cp icon_launcher.png web/favicon.png
            cp icon_launcher.png web/icons/Icon-192.png
            cp icon_launcher.png web/icons/Icon-512.png
            cp icon_launcher.png web/icons/Icon-maskable-192.png
            cp icon_launcher.png web/icons/Icon-maskable-512.png
            echo "🏆 Branding assets successfully injected into web directory structure."
          else
            echo "Error: icon_launcher.png is missing from the root of your project!"
            exit 1
          fi

      - name: Repair Index HTML & Force Local SDK Resolution
        run: |
          sed -i 's|<base href="[^"]*">|<base href="$FLUTTER_BASE_HREF">|g' web/index.html || true
          flutter config --enable-web
          
          echo "" >> pubspec.yaml
          echo "dependency_overrides:" >> pubspec.yaml
          echo "  flutter_web_plugins:" >> pubspec.yaml
          echo "    sdk: flutter" >> pubspec.yaml
          
          rm -rf .dart_tool/
          rm -f pubspec.lock
          flutter pub get

      - name: Auto Clean and Apply Codebase Corrections
        run: |
          echo "🩹 Running automated source corrections..."
          dart fix --apply || echo "Continuing build with remaining non-breaking issues"
          dart run flutter_launcher_icons || echo "Skipping icon generation"

      - name: Codebase Source Healing & Assembly pass
        run: |
          echo "📡 Initiating filtered codebase optimization pass..."
          
          echo "🩹 Patching local codebase compilation bugs..."
          
          if [ -f lib/main.dart ]; then
            sed -i "s|import 'repositories/app_repository.dart';|import 'services/app_repository.dart';|g" lib/main.dart || true
          fi

          if [ -f lib/services/app_repository.dart ]; then
            sed -i "s|Icons.viewin_ar_rounded|Icons.view_in_ar_rounded|g" lib/services/app_repository.dart || true
            
            if ! grep -q "class RankItem" lib/services/app_repository.dart; then
              cat << 'EOF' >> lib/services/app_repository.dart

class RankItem {
  final String title;
  RankItem({required this.title});
}
EOF
            fi
          fi

          if [ -f lib/views/subjects_view.dart ]; then
            sed -i 's|class RankView |class SubjectsView |g' lib/views/subjects_view.dart || true
          fi

          if [ -f lib/screens/main_layout_screen.dart ]; then
            sed -i 's|RewardsView(),|RewardsView(onStateMutation: (_) {}),|g' lib/screens/main_layout_screen.dart || true
            sed -i 's|const SubjectsView()|SubjectsView()|g' lib/screens/main_layout_screen.dart || true
            sed -i 's|SubjectsView(),|SubjectsView(),|g' lib/screens/main_layout_screen.dart || true
          fi

          if [ -f lib/views/rank_view.dart ]; then
            sed -i 's|=> r.title ==|=> (r as dynamic).title ==|g' lib/views/rank_view.dart || true
          fi

          ROUTER_FILE="lib/generated_router.dart"
          cat << 'EOF' > "$ROUTER_FILE"
          import 'package:flutter/material.dart';
          
          class AutomatedRouter {
            static Route resolveRoutes(RouteSettings settings) {
              final String path = settings.name ?? '/';
              return MaterialPageRoute(
                settings: settings,
                builder: (BuildContext context) {
                  if (path == '/') return const SplashScreen();
                  return const SplashScreen();
                },
              );
            }
          }
          EOF

          while read -r file; do
            clean_import_path="${file#lib/}"
            if [[ "$clean_import_path" == "main.dart" || "$clean_import_path" == "generated_router.dart" ]]; then
              continue
            fi

            if [[ ! "$file" =~ (screens/|views/|pages/) && ! "$file" =~ (_screen\.dart|_view\.dart|_page\.dart) ]]; then
              continue
            fi

            if [[ "$file" =~ (_stub\.dart|_web\.dart) ]]; then
              continue
            fi

            filename_lc=$(basename "$file" .dart | tr '[:upper:]' '[:lower:]')
            if [[ "$filename_lc" =~ (button|card|dropdown|dialog|popup|nav_bar|field|bubble|selector|lock|display|chart|painter|offer|slider) ]]; then
              continue
            fi

            sed -i 's|Scaffold(|Scaffold(resizeToAvoidBottomInset: true, |g' "$file" 2>/dev/null || true
            sed -i 's|setVolume(1.0)|setVolume(0.0)|g' "$file" 2>/dev/null || true
            sed -i 's|..initialize()|..initialize().then((_) { ..setVolume(0.0); })|g' "$file" 2>/dev/null || true
            sed -i "s|'assets/icon_launcher.png'|'icon_launcher.png'|g" "$file" 2>/dev/null || true
            sed -i "s|'assets/intro.mp4'|'intro.mp4'|g" "$file" 2>/dev/null || true
            sed -i 's|Image.asset(|Image.asset(cacheWidth: 480, |g' "$file" 2>/dev/null || true
          done < <(find lib -type f -name "*.dart")

          find lib -type f -name "*.dart" -exec sed -i 's|class PolymorphicHologramPainter extends CustomPainter {|class PolymorphicHologramPainter extends CustomPainter { @override bool shouldRepaint(CustomPainter oldDelegate) => false;|g' {} + 2>/dev/null || true
          find lib -type f -name "*.dart" -exec sed -i 's|if (mounted)|if (context.mounted)|g' {} + 2>/dev/null || true
          echo "🏆 System wide filtered mapping complete."

      - name: Build Production Web App for GitHub Pages
        run: |
          flutter build web --release --base-href "/mind-spark/"
          echo "Patching bootstrap config..."
          sed -i 's|serviceWorkerVersion:|// serviceWorkerVersion:|g' build/web/index.html || true
          rm -f build/web/flutter_service_worker.js || true

          echo "Injecting absolute asset pathways directly into deployment canvas..."
          cp -f icon_launcher.png build/web/icon_launcher.png || true
          cp -f intro.mp4 build/web/intro.mp4 || true
          mkdir -p build/web/assets
          cp -f icon_launcher.png build/web/assets/icon_launcher.png || true
          cp -f intro.mp4 build/web/assets/intro.mp4 || true

          echo "Recovering native Flutter Material Design Icon Fonts..."
          mkdir -p build/web/assets/fonts/
          FLUTTER_SDK_FONTS="${{ env.FLUTTER_ROOT }}/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf"
          if [ -f "$FLUTTER_SDK_FONTS" ]; then
            cp -f "$FLUTTER_SDK_FONTS" build/web/assets/fonts/MaterialIcons-Regular.otf || true
          else
            find /opt/hostedtoolcache/flutter -name "MaterialIcons-Regular.otf" -exec cp -f {} build/web/assets/fonts/ \; 2>/dev/null || true
          fi

          echo "Injecting custom web application icon blueprint..."
          mkdir -p build/web/icons
          cp -f icon_launcher.png build/web/icons/Icon-192.png || true
          cp -f icon_launcher.png build/web/icons/Icon-512.png || true

          cat << 'EOF' > build/web/manifest.json
          {
            "name": "Mind Spark",
            "short_name": "Mind Spark",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#1B1424",
            "theme_color": "#1B1424",
            "description": "AI TUTOR & AR LAB",
            "orientation": "portrait",
            "icons": [
              {
                "src": "icons/Icon-192.png",
                "sizes": "192x192",
                "type": "image/png"
              },
              {
                "src": "icons/Icon-512.png",
                "sizes": "512x512",
                "type": "image/png"
              }
            ]
          }
          EOF

          cat << 'EOF' > build/web/assets/AssetManifest.json
          {
            "packages/material_design_icons_flutter/lib/fonts/MaterialIcons-Regular.otf": [
              "assets/fonts/MaterialIcons-Regular.otf"
            ]
          }
          EOF

      - name: Build Release APK
        run: |
          flutter build apk --release \
            --build-name=1.0.0 \
            --build-number=1 \
            --no-tree-shake-icons

      - name: Build Release App Bundle (AAB)
        run: |
          flutter build appbundle --release \
            --build-name=1.0.0 \
            --build-number=1 \
            --no-tree-shake-icons

      - name: Upload Android APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

      - name: Upload Web Build Blueprint for Deployment Step
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy Live to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages API Pipeline
        id: deployment
        uses: actions/deploy-pages@v4
