name: Build Mind Spark APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Generate Android Directory
        run: |
          mkdir -p android/gradle/wrapper
          mkdir -p android/app/src/main/java/com/mindspark/com

          echo "distributionBase=GRADLE_USER_HOME" > android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.1-bin.zip" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties

          echo "allprojects { repositories { google(); mavenCentral() } }" > android/build.gradle
          echo "rootProject.buildDir = '../build'" >> android/build.gradle
          echo "subprojects { project.buildDir = \"\${rootProject.buildDir}/\${project.name}\" }" >> android/build.gradle
          echo "subprojects { project.evaluationDependsOn(':app') }" >> android/build.gradle
          echo "tasks.register(\"clean\", Delete) { delete rootProject.buildDir }" >> android/build.gradle

          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m" > android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

          echo "plugins {" > android/app/build.gradle
          echo "    id \"com.android.application\"" >> android/app/build.gradle
          echo "    id \"kotlin-android\"" >> android/app/build.gradle
          echo "    id \"dev.flutter.flutter-gradle-plugin\"" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle
          echo "" >> android/app/build.gradle
          echo "android {" >> android/app/build.gradle
          echo "    namespace \"com.mindspark.com\"" >> android/app/build.gradle
          echo "    compileSdk flutter.compileSdkVersion" >> android/app/build.gradle
          echo "    ndkVersion flutter.ndkVersion" >> android/app/build.gradle
          echo "" >> android/app/build.gradle
          echo "    compileOptions {" >> android/app/build.gradle
          echo "        sourceCompatibility JavaVersion.VERSION_1_8" >> android/app/build.gradle
          echo "        targetCompatibility JavaVersion.VERSION_1_8" >> android/app/build.gradle
          echo "    }" >> android/app/build.gradle
          echo "" >> android/app/build.gradle
          echo "    kotlinOptions {" >> android/app/build.gradle
          echo "        jvmTarget = '1.8'" >> android/app/build.gradle
          echo "    }" >> android/app/build.gradle
          echo "" >> android/app/build.gradle
          echo "    defaultConfig {" >> android/app/build.gradle
          echo "        applicationId \"com.mindspark.com\"" >> android/app/build.gradle
          echo "        minSdk 24" >> android/app/build.gradle
          echo "        targetSdk flutter.targetSdkVersion" >> android/app/build.gradle
          echo "        versionCode 1" >> android/app/build.gradle
          echo "        versionName \"1.0.0\"" >> android/app/build.gradle
          echo "        multiDexEnabled true" >> android/app/build.gradle
          echo "    }" >> android/app/build.gradle
          echo "" >> android/app/build.gradle
          echo "    buildTypes {" >> android/app/build.gradle
          echo "        release {" >> android/app/build.gradle
          echo "            signingConfig signingConfigs.debug" >> android/app/build.gradle
          echo "            minifyEnabled true" >> android/app/build.gradle
          echo "            shrinkResources true" >> android/app/build.gradle
          echo "        }" >> android/app/build.gradle
          echo "    }" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle
          echo "" >> android/app/build.gradle
          echo "flutter {" >> android/app/build.gradle
          echo "    source '../..'" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle

          echo "package com.mindspark.com;" > android/app/src/main/java/com/mindspark/com/MainActivity.kt
          echo "" >> android/app/src/main/java/com/mindspark/com/MainActivity.kt
          echo "import io.flutter.embedding.android.FlutterActivity" >> android/app/src/main/java/com/mindspark/com/MainActivity.kt
          echo "" >> android/app/src/main/java/com/mindspark/com/MainActivity.kt
          echo "class MainActivity: FlutterActivity() {}" >> android/app/src/main/java/com/mindspark/com/MainActivity.kt

      - name: Install Dependencies
        run: flutter pub get

      - name: Apply Dart Fixes
        run: dart fix --apply

      - name: Format Dart Code
        run: dart format .

      - name: Build Release APK with Validation Bypass
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
