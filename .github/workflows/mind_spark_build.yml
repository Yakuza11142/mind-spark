name: Build and Deploy Mind Spark Cross-Platform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Multi-Platform Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Inject Custom Android & Web Shell
        run: |
          # 1. Establish custom clean platform directories
          mkdir -p android/gradle/wrapper
          mkdir -p android/app/src/main/kotlin/com/mindspark/app
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable
          mkdir -p web

          # 1.5 Write hardcoded local.properties with explicit fallback paths
          cat << EOF > android/local.properties
          sdk.dir=/usr/local/lib/android/sdk
          flutter.sdk=$FLUTTER_ROOT
          flutter.versionName=1.0.0
          flutter.versionCode=1
          flutter.buildMode=release
          EOF

          # 2. Verified Semantic Distribution mapping to solve the FileNotFoundException
          cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.0.0-all.zip
          EOF

          # 3. Secure settings.gradle with robust dynamic property safety checks
          cat << 'EOF' > android/settings.gradle
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  def propertiesFile = new File(settingsDir.parentFile, "local.properties")
                  if (propertiesFile.exists()) {
                      propertiesFile.withReader("UTF-8") { reader -> properties.load(reader) }
                  }
                  def sdkPath = properties.getProperty("flutter.sdk") ?: System.getProperty("flutter.sdk") ?: System.getenv("FLUTTER_ROOT")
                  if (sdkPath == null) {
                      throw new GradleException("flutter.sdk route missing from compile environment variables")
                  }
                  return sdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "9.0.1" apply false
          }
          include ":app"
          EOF

          # 4. Root pipeline build paths script
          cat << 'EOF' > android/build.gradle
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.buildDir = "../build"
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(":app")
          }
          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          # 5. Clean custom AGP 9 compile options (Strict Java 17 toolchain configurations)
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "dev.flutter.flutter-gradle-plugin"
          }
          android {
              namespace "com.mindspark.app"
              compileSdk 35
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlin {
                  compilerOptions {
                      jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  }
              }
              defaultConfig {
                  applicationId "com.mindspark.app"
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF

          # 6. Target custom MainActivity package mapping
          cat << 'EOF' > android/app/src/main/kotlin/com/mindspark/app/MainActivity.kt
          package com.mindspark.app
          import io.flutter.embedding.android.FlutterActivity
          class MainActivity: FlutterActivity()
          EOF

          # 7. Hardware layout requirements file
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Mindspark"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          # 8. Style paint maps preventing blank launch windows
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
              </style>
              <style name="NormalTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">?android:colorBackground</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/launch_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="?android:colorBackground" />
          </layer-list>
          EOF

          # 9. Performance tuning execution arguments
          cat << 'EOF' > android/gradle.properties
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # 10. Clean entrypoint HTML mapping your custom canvas runtime directly
          cat << 'EOF' > web/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <base href="$FLUTTER_BASE_HREF">
            <meta charset="UTF-8">
            <title>Mind Spark Elite</title>
            <script src="flutter.js" defer></script>
          </head>
          <body>
            <script>
              window.addEventListener('load', function(ev) {
                _flutter.loader.loadEntrypoint({
                  serviceWorker: {
                    serviceWorkerVersion: serviceWorkerVersion,
                  },
                  onEntrypointLoaded: function(engineInitializer) {
                    engineInitializer.initializeEngine().then(function(appRunner) {
                      appRunner.runApp();
                    });
                  }
                });
              });
            </script>
          </body>
          </html>
          EOF

          # 11. Minimal Web manifest schema mapping to clear compiler asset lookups
          cat << 'EOF' > web/manifest.json
          {
              "name": "Mind Spark Elite",
              "short_name": "MindSpark",
              "start_url": ".",
              "display": "standalone",
              "background_color": "#000000",
              "theme_color": "#000000",
              "description": "AI TUTOR & AR LAB",
              "orientation": "portrait-primary",
              "prefer_related_applications": false,
              "icons": []
          }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Apply Dart Fixes
        run: dart fix --apply

      - name: Format Dart Code
        run: dart format .

      - name: Generate App Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build Release APK with Hardcoded Project Property Safeties
        run: flutter build apk --release --android-skip-build-dependency-validation --dart-define=DART_SHARED_PACKAGES=true

      - name: Build Release App Bundle (AAB)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Build Production Web App for GitHub Pages
        run: flutter build web --release --base-href "/mind-spark/"

      - name: Upload Android APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

      - name: Upload Web Build Blueprint for Deployment Step
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy Live to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages API Pipeline
        id: deployment
        uses: actions/deploy-pages@v4
